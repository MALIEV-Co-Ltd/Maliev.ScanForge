name: Release validated source
on:
  workflow_run:
    workflows: [Validate browser CAD]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-release-main
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Skip superseded builds
        id: head
        env:
          VALIDATED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$VALIDATED_HEAD" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - name: Plan version and cumulative notes
        if: steps.head.outputs.current == 'true'
        run: node scripts/release.mjs plan
      - name: Publish tag and milestone source release
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.mjs publish
